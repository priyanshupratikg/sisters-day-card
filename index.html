<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Sister's Day ❤️ Riya</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div id="loader">
        <h1>💖</h1>
        <h2>Loading your surprise...</h2>
    </div>

    <!-- Background -->

    <div class="background"></div>

    <!-- Music -->

    <audio id="bgMusic" loop>

        <source src="assets/music/music.mp3" type="audio/mpeg">

    </audio>

    <!-- Landing Screen -->

    <section id="landing">

        <h1>

            Happy Sister's Day

        </h1>

        <h2>

            Riya ❤️

        </h2>

        <p>

            I made something special for you...

        </p>

        <img id="envelope" src="assets/decorations/envelope.png" alt="Envelope">

        <button id="openEnvelope">

            💌 Open Your Card

        </button>

    </section>

    <!-- Greeting Card -->

    <section id="cardSection">

        <!-- Cover -->

        <div id="cover">

            <img src="assets/backgrounds/card-cover.png" alt="Card Cover">

        </div>

        <!-- Inside -->

        <div id="inside">

            <img id="photo" src="assets/photos/1.jpeg" alt="Photo">

            <div id="textArea">

                <h2 id="title">

                </h2>

                <p id="message">

                </p>

            </div>
            <div id="pageNumber"></div>

            <div class="buttons">

                <button id="prev">

                    ◀ Previous

                </button>

                <button id="next">

                    Next ▶

                </button>

            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
